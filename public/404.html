<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>Page not found | Aranya Kishor Das</title>
  <link rel="icon" href="/icon.png" type="image/png" />
  <style>
    :root { --bg: #F7F5F0; --card: #FFFFFF; --text: #1A1917; --muted: #6B675E; --accent: #1E4334; --on-accent: #FFFFFF; --border: #E2DDD3; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #121210; --card: #1B1B18; --text: #EDEBE5; --muted: #9A968C; --accent: #7FC4A0; --on-accent: #0F1A15; --border: #2F2E2A; }
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px; background: var(--bg); color: var(--text);
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    main { max-width: 420px; width: 100%; background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 32px; text-align: center; }
    .code { font-family: "JetBrains Mono", monospace; font-size: 12px; letter-spacing: 0.1em; color: var(--accent); text-transform: uppercase; }
    h1 { font-size: 1.5rem; margin: 8px 0 12px; }
    p { color: var(--muted); line-height: 1.6; margin: 0 0 24px; }
    a { display: inline-block; background: var(--accent); color: var(--on-accent); text-decoration: none; padding: 10px 18px; border-radius: 8px; font-weight: 600; }
    a:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <div class="code">Error 404</div>
    <h1>Page not found</h1>
    <p>This page doesn't exist. You can find Aranya Kishor Das's research, robotics and software projects on the homepage.</p>
    <a href="/">Go to the homepage</a>
  </main>
</body>
</html>
