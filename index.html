<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <link rel="icon" href="/icon.png" type="image/png" />
  <link rel="shortcut icon" href="/icon.png" type="image/png" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#F7F5F0" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#121210" media="(prefers-color-scheme: dark)" />
  <meta name="color-scheme" content="light dark" />
  
  <!-- Title, description, canonical, social tags and JSON-LD are generated by scripts/prerender.js from seo.config.js -->
  <!-- SEO:HEAD -->
  <!-- Manifest & Favicons -->
  <link rel="apple-touch-icon" href="/icon.png" />
  <script>
    // Apply a saved theme choice before first paint to avoid a flash
    try {
      var t = localStorage.getItem("theme");
      if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
    } catch (e) {}
  </script>
  <link rel="manifest" href="/manifest.json" />



  <!-- Google Analytics (GA4) -->
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag() { dataLayer.push(arguments); }
    gtag('js', new Date());
    gtag('config', 'G-E1XPQY97P2');
    // Load the analytics library after the page has loaded so it doesn't compete with content
    window.addEventListener("load", function () {
      var s = document.createElement("script");
      s.async = true;
      s.src = "https://www.googletagmanager.com/gtag/js?id=G-E1XPQY97P2";
      document.head.appendChild(s);
    });
  </script>
</head>

<body>
  <div id="root"></div>

  <script type="module" src="/src/index.jsx"></script>
</body>

</html>
