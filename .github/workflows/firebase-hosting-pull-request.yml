name: Deploy to Firebase Hosting on PR
on: pull_request
permissions:
  checks: write
  contents: read
  pull-requests: write
jobs:
  build_and_preview:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
      - name: Install
        run: npm ci && npm ci --prefix server
      - name: Lint
        run: npm run lint
      - name: Check backend
        run: npm run check --prefix server
        env:
          DATABASE_URL: ""
          PGHOST: 127.0.0.1
          PGPORT: 1
      - name: Build
        run: npm run build
        env:
          REACT_APP_API_URL: https://researchportfolio.onrender.com/api
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ARANYAPORTFOLIO }}
          projectId: aranyaportfolio
