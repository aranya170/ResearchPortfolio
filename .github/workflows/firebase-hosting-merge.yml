# https://github.com/firebase/firebase-tools

name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - main
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
      - name: Install
        run: npm ci && npm ci --prefix server
      - name: Lint
        run: npm run lint
      - name: Check backend
        run: npm run check --prefix server
        env:
          DATABASE_URL: ""
          PGHOST: 127.0.0.1
          PGPORT: 1
      - name: Build
        run: npm run build
        env:
          REACT_APP_API_URL: https://researchportfolio.onrender.com/api
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ARANYAPORTFOLIO }}
          channelId: live
          projectId: aranyaportfolio
